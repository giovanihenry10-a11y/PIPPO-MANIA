<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="carrinho.css">
    <title>Carrinho - Pippo Mania</title>
</head>
<body>

<div class="cart-container">
    <h2>Seu Carrinho</h2>
    
    <div id="cart-items-list"></div>

        <button class="checkout-btn" onclick="checkoutCart()">Confirmar Compra</button>
        
        <a href="e.html" class="back-btn">Continuar Comprando</a>
    </div>
</div>

<script src="carrinho.js"></script>
