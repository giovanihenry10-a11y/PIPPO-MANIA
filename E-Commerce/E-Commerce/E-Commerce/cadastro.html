<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css"> </head>
<body>

    <div class="cadastro-container">
        <img src="imagens/LOGO.png" alt="Logo Pippo Mania">
        <h2>Criar Conta</h2>
        <form id="formCadastro">
            <div class="grupo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu email">
            </div>

            <div class="grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Crie uma senha">
            </div>

            <button type="submit" class="btn-enviar">Cadastrar</button>
        </form>
    </div>
      <script src="cadastro.js"></script>
</body>
</html>
